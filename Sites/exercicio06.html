    <div>
    <h2>Cyberexpress</h2>
     <main>
        <h1>Caixa de sugestão</h1>

            Escreva na caixa de texto abaixo o que podemos fazer para melhorar

         <fieldset>
<legend><strong>Dados pessoais
</strong></legend>
<label>Nome</label>
        
             
             <br>
               <input type="text" name="nome" placeholder="Digite seu nome " required>

               <fieldset>
   <fieldset>

</optgroup>
</select>
